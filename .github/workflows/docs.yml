name: Documentation

# Builds the documentation site on every change that touches it (including the library's doc comments, which feed the API reference).
# Deploys to GitHub Pages only from master. One-time setup by the maintainer: Settings > Pages > Build and deployment > Source: GitHub Actions.

on:
  push:
    branches: [master]
    paths: ['website/**', 'packages/quantum-safe-ts/src/**', '.github/workflows/docs.yml']
  pull_request:
    paths: ['website/**', 'packages/quantum-safe-ts/src/**', '.github/workflows/docs.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      # TypeDoc needs the library's own dev dependencies to type-check the sources it documents.
      - working-directory: packages/quantum-safe-ts
        run: npm ci --ignore-scripts
      - working-directory: website
        run: |
          npm ci
          npm run build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: website/.vitepress/dist

  deploy:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
