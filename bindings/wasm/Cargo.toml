[package]
name = "quantum-safe-wasm"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "wasm-bindgen bindings for quantum-safe-core (private; wrapped by the quantum-safe-ts npm package)"
repository = "https://github.com/AnimeshShaw/quantum-safe-ts"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
quantum-safe-core = { path = "../../crates/quantum-safe-core" }
wasm-bindgen = "0.2"
js-sys = "0.3"
serde_json = "1"
zeroize = "1"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
