doc = false

[[bin]]
name = "fuzz_kem_decapsulate"
path = "fuzz_targets/fuzz_kem_decapsulate.rs"
test = false
doc = false

[[bin]]
name = "fuzz_keys"
path = "fuzz_targets/fuzz_keys.rs"
test = false
doc = false

[[bin]]
name = "fuzz_signed_message"
path = "fuzz_targets/fuzz_signed_message.rs"
test = false
doc = false

[[bin]]
name = "fuzz_sig_secret_key"
path = "fuzz_targets/fuzz_sig_secret_key.rs"
test = false
doc = false

[[bin]]
name = "fuzz_wire"
path = "fuzz_targets/fuzz_wire.rs"
test = false
doc = false

[[bin]]
name = "fuzz_lms_verify"
path = "fuzz_targets/fuzz_lms_verify.rs"
test = false
doc = false
