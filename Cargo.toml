[workspace]
resolver = "2"
members = ["crates/quantum-safe-core", "bindings/wasm"]
exclude = ["fuzz"]

# Cryptographic crates are far too slow unoptimized (SLH-DSA especially).
[profile.test]
opt-level = 3

[profile.release]
# Speed over size: opt-level 3 measured 2-3x faster than "s" for ML-KEM/ML-DSA at +48% WASM size. SIMD128 added only 3-8% and would drop support for old runtimes, so it is off.
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
