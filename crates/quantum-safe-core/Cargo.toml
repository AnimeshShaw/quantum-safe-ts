[package]
name = "quantum-safe-core"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Pure-Rust hybrid post-quantum crypto core for quantum-safe-ts"
repository = "https://github.com/AnimeshShaw/quantum-safe-ts"

[dependencies]
aes-gcm = "0.11.1"
argon2 = "0.6.0"
ciborium = "0.2.2"
getrandom = "0.4.3"
hkdf = "0.13.0"
ml-kem = { version = "0.3.2", features = ["getrandom"] }
sha2 = "0.11.0"
thiserror = "2"
x25519-dalek = { version = "3.0.0", features = ["static_secrets", "getrandom"] }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
