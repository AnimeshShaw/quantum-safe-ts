[package]
name = "quantum-safe-core"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Pure-Rust hybrid post-quantum crypto core for quantum-safe-ts"
repository = "https://github.com/AnimeshShaw/quantum-safe-ts"

[dependencies]
aes-gcm = "0.11.1"
argon2 = "0.6.0"
base64 = "0.22"
ciborium = "0.2.2"
ed25519-dalek = "3.0.0"
getrandom = "0.4.3"
hkdf = "0.13.0"
ml-dsa = { version = "0.1.1", features = ["zeroize"] }
ml-kem = { version = "0.3.2", features = ["getrandom", "zeroize"] }
p256 = { version = "0.14.0", features = ["ecdh", "ecdsa", "pem", "pkcs8"] }
sha2 = "0.11.0"
slh-dsa = "0.1.0"
rand_core06 = { package = "rand_core", version = "0.6" }
thiserror = "2"
x-wing = { version = "0.1.1", features = ["getrandom", "zeroize"] }
x25519-dalek = { version = "3.0.0", features = ["static_secrets", "getrandom"] }
serde_json = "1"
zeroize = { version = "1", features = ["zeroize_derive"] }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
hex = "0.4"

# getrandom has no default OS-RNG backend for wasm32 -- it must be told
# explicitly to use the browser/Node Web Crypto API via "wasm_js". Native
# targets keep using their normal OS RNG (the unconditional `getrandom`
# entry above); this section only adds the extra feature for wasm32.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4.3", features = ["wasm_js"] }
